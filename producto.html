<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle del Producto - MiTienda.pe</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Estilos específicos para la vista de detalle */
        .detalle-container {
            max-width: 1000px;
            margin: 50px auto;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            border: 1px solid #e1e1e1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
        }

        .detalle-img {
            width: 100%;
            height: 400px;
            object-fit: cover;
            border-radius: 6px;
        }

        .detalle-info h1 {
            font-size: 24px;
            margin: 10px 0;
            color: #111;
        }

        .detalle-info .brand {
            font-size: 14px;
            color: #777;
            text-transform: uppercase;
            font-weight: bold;
        }

        .detalle-pricing {
            margin: 20px 0;
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .detalle-pricing .offer {
            font-size: 22px;
            font-weight: bold;
            color: #d9534f;
        }

        .detalle-pricing .normal {
            font-size: 16px;
            color: #999;
            text-decoration: line-through;
        }

        .descripcion {
            font-size: 14px;
            color: #555;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .volver-btn {
            display: inline-block;
            margin-bottom: 20px;
            text-decoration: none;
            color: #111;
            font-weight: bold;
            font-size: 14px;
        }
        
        .volver-btn:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .detalle-container {
                grid-template-columns: 1fr;
                margin: 20px;
                padding: 15px;
            }
        }
    </style>
</head>
<body>

    <!-- Aviso Superior -->
    <div class="top-banner">
        ¡ENVÍOS A TODO EL PERÚ! 🇵🇪 • PAGOS POR YAPE, PLIN Y TRANSFERENCIA
    </div>

    <!-- Cabecera Simple -->
    <header>
        <div class="logo"><a href="index.html" style="text-decoration:none; color:inherit;">MiTienda.pe</a></div>
        <button class="cart-btn" onclick="toggleCart()">🛒 Carrito (<span id="cart-count">0</span>)</button>
    </header>

    <div class="container">
        <a href="index.html" class="volver-btn">← Volver al catálogo</a>

        <div class="detalle-container" id="detalle-content">
            <!-- Los datos del producto se cargarán aquí mediante JavaScript -->
            <p>Cargando producto...</p>
        </div>
    </div>

    <!-- Fondo Oscuro Overlay -->
    <div class="overlay" id="overlay" onclick="toggleCart()"></div>

    <!-- Menú Lateral del Carrito (Mismo diseño) -->
    <div class="cart-modal" id="cartModal">
        <div class="cart-header">
            <h3>Tu Carrito y Envío</h3>
            <button class="close-cart" onclick="toggleCart()">&times;</button>
        </div>

        <div class="cart-items" id="cartItemsContainer">
            <p style="color: #777; text-align: center; margin-top: 10px;">Tu carrito está vacío</p>
        </div>

        <div class="checkout-form">
            <h4>Datos de Envío (Perú)</h4>
            <div class="form-group">
                <label>Nombre y Apellido:</label>
                <input type="text" id="nombreCliente" placeholder="Ej. Juan Pérez">
            </div>
            <div class="form-group">
                <label>Teléfono / Celular:</label>
                <input type="text" id="telefonoCliente" placeholder="Ej. 999888777">
            </div>
            <div class="form-group">
                <label>Ciudad / Departamento:</label>
                <input type="text" id="ciudadCliente" placeholder="Ej. Lima / Arequipa / Piura">
            </div>
            <div class="form-group">
                <label>Dirección exacta / Agencia:</label>
                <input type="text" id="direccionCliente" placeholder="Ej. Av. Larco 123 o Agencia Shalom">
            </div>
        </div>

        <div class="cart-footer">
            <div class="cart-total">
                <span>Total a pagar:</span>
                <span id="cartTotalText">S/. 0.00</span>
            </div>
            <button class="checkout-whatsapp" onclick="finalizarCompraWhatsApp()">Confirmar y Pedir por WhatsApp</button>
        </div>
    </div>

    <!-- Script para manejar el detalle y el carrito -->
    <script src="script.js"></script>
    <script>
        // Código exclusivo para cargar la vista del producto individual al abrir la página
        window.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const idProducto = parseInt(params.get('id'));

            const producto = productos.find(p => p.id === idProducto);
            const contenedor = document.getElementById('detalle-content');

            if (!producto) {
                contenedor.innerHTML = `<p style="grid-column: 1/-1; text-align:center;">Producto no encontrado.</p>`;
                return;
            }

            let opcionesTallas = producto.tallas.map(t => `<option value="${t}">${t}</option>`).join('');

            contenedor.innerHTML = `
                <div>
                    <img src="${producto.imagen}" alt="${producto.nombre}" class="detalle-img">
                </div>
                <div class="detalle-info">
                    <span class="brand">${producto.marca}</span>
                    <h1>${producto.nombre}</h1>
                    <div class="detalle-pricing">
                        <span class="offer">S/. ${producto.precioOferta.toFixed(2)}</span>
                        <span class="normal">S/. ${producto.precioNormal.toFixed(2)}</span>
                    </div>
                    <p class="descripcion">Prenda 100% original importada de excelente calidad. Ideal para un look casual y moderno. Cuenta con acabados premium y máxima comodidad.</p>
                    
                    <div class="size-selector" style="margin-bottom: 20px;">
                        <label style="font-weight:bold;">Selecciona Talla:</label>
                        <select id="talla-${producto.id}" style="padding: 8px; width: 100%; margin-top: 5px;">
                            ${opcionesTallas}
                        </select>
                    </div>

                    <button class="add-to-cart" onclick="agregarAlCarrito(${producto.id})" style="padding: 14px; font-size: 16px;">Añadir al Carrito</button>
                </div>
            `;
        });
    </script>
</body>
</html>
